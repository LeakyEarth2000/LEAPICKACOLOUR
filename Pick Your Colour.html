<style>
/* Layout: one full-bleed 3D stage with the panel in the middle; a short question top-left, two choices docked at the bottom.
   Single committed look: soft pastel daylight, so every colour below is set explicitly. */
:root {
  --bg: #f4ecf6;
  --panel: rgba(255, 255, 255, 0.8);
  --panel-line: rgba(120, 80, 150, 0.14);
  --fg: #3f2453;
  --muted: #7b6390;
  --press: #f3e6f7;
  --pick: #f7b6d0;
  --ink-on-pick: #3a1b33;
  --focus: #9b7fd6;
  --display: "Fredoka", "Nunito", ui-rounded, system-ui, sans-serif;
  --body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); overflow: hidden; }
#app { position: relative; height: 100%; width: 100%; overflow: hidden; }
#stage { position: absolute; inset: 0; }
#stage canvas { display: block; width: 100%; height: 100%; touch-action: none; outline: none; }
.panel { background: var(--panel); border: 1px solid var(--panel-line); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
.intro { position: absolute; top: 16px; left: calc(16px + env(safe-area-inset-left, 0px)); right: calc(16px + env(safe-area-inset-right, 0px)); pointer-events: none; display: flex; }
.intro .panel { border-radius: 18px; padding: 14px 18px; max-width: 360px; }
.intro h1 { margin: 0; font-family: var(--display); font-weight: 600; font-size: clamp(24px, 3.4vw, 32px); line-height: 1.1; text-wrap: balance; }
.intro p { margin: 6px 0 0; color: var(--muted); font-size: 14px; line-height: 1.45; }
.dock { position: absolute; left: calc(16px + env(safe-area-inset-left, 0px)); right: calc(16px + env(safe-area-inset-right, 0px)); bottom: 18px; display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; pointer-events: none; }
.group { display: flex; align-items: center; gap: 10px; border-radius: 18px; padding: 6px 6px 6px 14px; pointer-events: auto; max-width: 100%; }
.group .label { font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.seg { display: flex; gap: 4px; }
.seg button { font: 500 15px var(--body); color: var(--fg); background: transparent; border: 0; border-radius: 12px; padding: 9px 14px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
.seg button:hover { background: var(--press); }
.seg button[aria-pressed="true"] { background: var(--pick); color: var(--ink-on-pick); }
.seg button:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.group .label b { font-family: var(--body); font-weight: 600; font-size: 14px; letter-spacing: 0; text-transform: none; color: var(--fg); margin-left: 6px; display: inline-block; min-width: 3.9em; }
.swatches { display: flex; gap: 4px; }
.sw { width: 36px; height: 36px; padding: 0; border: 0; border-radius: 50%; background: transparent; cursor: pointer; display: grid; place-items: center; flex: none; }
.sw:hover { background: var(--press); }
.sw[aria-pressed="true"] { box-shadow: inset 0 0 0 2.5px var(--pick); }
.sw:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.dot { width: 24px; height: 24px; border-radius: 50%; border: 1px solid rgba(60, 30, 70, 0.25); flex: none; }
@media (max-width: 560px) {
  .colour-group { flex-direction: column; align-items: flex-start; padding: 10px 10px 8px 14px; gap: 6px; }
  .seg button { padding: 8px 12px; font-size: 14px; }
}
</style>

<div id="app">

  <header class="intro"><div class="panel">
    <h1>Which one do you like?</h1>
    <p>Pick a colour, then try it with and without stickers. Drag to turn it round.</p>
  </div></header>
  <div class="dock">
    <div class="group panel colour-group">
      <span class="label">Colour <b id="pickedName">Black</b></span>
      <div class="swatches" id="colours">

        <button class="sw" data-c="white" aria-pressed="false" aria-label="White" title="White"><span class="dot" style="background:#f6f5f1"></span></button>
        <button class="sw" data-c="green" aria-pressed="false" aria-label="Green" title="Green"><span class="dot" style="background:#1f6e3d"></span></button>
        <button class="sw" data-c="blue" aria-pressed="false" aria-label="Blue" title="Blue"><span class="dot" style="background:#1f4fa3"></span></button>
        <button class="sw" data-c="purple" aria-pressed="false" aria-label="Purple" title="Purple"><span class="dot" style="background:#4c2d82"></span></button>
        <button class="sw" data-c="red" aria-pressed="false" aria-label="Red" title="Red"><span class="dot" style="background:#b5222c"></span></button>
        <button class="sw" data-c="yellow" aria-pressed="false" aria-label="Yellow" title="Yellow"><span class="dot" style="background:#e8be22"></span></button>
      </div>
    </div>
    <div class="group panel">
      <span class="label">Stickers</span>
      <div class="seg" id="stickerSeg">
        <button id="s-off" data-s="off" aria-pressed="true">Off</button>
        <button id="s-on" data-s="on" aria-pressed="false">On</button>
      </div>
    </div>
  </div>
</div>

function resize() {
  const w = stageEl.clientWidth, h = stageEl.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.fov = camera.aspect < 0.8 ? 44 : camera.aspect < 1.2 ? 36 : 30;
  const want = camera.aspect < 0.8 ? 4.2 : camera.aspect < 1.2 ? 3.6 : 3.3;
  const dir = camera.position.clone().sub(controls.target).normalize();
  camera.position.copy(controls.target).addScaledVector(dir, want);
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);

const clock = new THREE.Clock();
let t = 0;
function loop() {
  t += Math.min(clock.getDelta(), 0.25);
  drawScreen(t);
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
